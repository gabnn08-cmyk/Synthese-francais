<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Synthese de francais</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="page-shell">
    <header class="hero">
      <div>
        <p class="eyebrow">Application pedagogique</p>
        <h1>Tableau de bord des evaluations de francais</h1>
        <p class="hero-copy">
          Chaque eleve dispose de son compte, saisit ses resultats et retrouve une synthese personnelle. La professeure
          consulte la classe, les tendances et les parcours individuels.
        </p>
      </div>
    </header>

    <main id="app"></main>
  </div>

  <template id="login-template">
    <section class="panel auth-panel">
      <div class="panel-header">
        <div>
          <p class="eyebrow">Connexion</p>
          <h2>Acces eleve ou professeure</h2>
        </div>
      </div>
      <form id="login-form" class="stack">
        <label>
          Identifiant
          <input name="username" type="text" placeholder="prenom.nom" autocomplete="username" required>
        </label>
        <label>
          Mot de passe
          <input name="password" type="password" placeholder="Votre mot de passe" autocomplete="current-password" required>
        </label>
        <button type="submit" class="primary-button">Se connecter</button>
        <p id="login-error" class="message error"></p>
      </form>

      <hr class="divider">

      <form id="register-form" class="stack">
        <div>
          <p class="eyebrow">Nouvel eleve</p>
          <h3>Creer un compte</h3>
        </div>
        <label>
          Nom complet
          <input name="full_name" type="text" placeholder="Nadia Petit" autocomplete="name" minlength="2" required>
        </label>
        <label>
          Identifiant
          <input name="username" type="text" placeholder="nadia.petit" autocomplete="username" minlength="3" required>
        </label>
        <label>
          Mot de passe
          <input name="password" type="password" placeholder="8 caracteres minimum" autocomplete="new-password" minlength="8" required>
        </label>
        <button type="submit" class="ghost-button">Creer mon compte</button>
        <p id="register-error" class="message error"></p>
      </form>
    </section>
  </template>

  <script src="/app.js" defer></script>
</body>
</html>
